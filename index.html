<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>David Ogburu Akwari — Portfolio</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{background:linear-gradient(150deg,#cfd1d6 0%,#c0c2c8 45%,#aeb3bb 100%);background-attachment:fixed}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.95;mix-blend-mode:overlay}
</style></head><body><canvas id="c"></canvas>
<script>
(function(){
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:true});
var SCALE=3,w=0,h=0,curr,prev,image,tint=[229,231,235];
function resize(){w=Math.max(1,Math.ceil(innerWidth/SCALE));h=Math.max(1,Math.ceil(innerHeight/SCALE));canvas.width=w;canvas.height=h;curr=new Float32Array(w*h);prev=new Float32Array(w*h);image=ctx.createImageData(w,h);}
function drop(cx0,cy0,power,r){var cx=Math.floor(cx0/SCALE),cy=Math.floor(cy0/SCALE);for(var y=-r;y<=r;y++)for(var x=-r;x<=r;x++){var d=Math.sqrt(x*x+y*y);if(d>r)continue;var px=cx+x,py=cy+y;if(px<1||py<1||px>=w-1||py>=h-1)continue;prev[py*w+px]-=power*Math.cos(d/r*Math.PI/2);}}
function step(){var damping=.988,k=.18,self=2-4*k,x,y,i;
for(y=1;y<h-1;y++){var row=y*w;for(x=1;x<w-1;x++){i=row+x;curr[i]=(prev[i]*self+k*(prev[i-1]+prev[i+1]+prev[i-w]+prev[i+w])-curr[i])*damping;}}
var t=prev;prev=curr;curr=t;var data=image.data;
for(y=1;y<h-1;y++){var r2=y*w;for(x=1;x<w-1;x++){i=r2+x;var shade=(prev[i-1]-prev[i+1]+prev[i-w]-prev[i+w])*.5;var amp=Math.min(1,Math.abs(prev[i])*.16+Math.abs(shade)*.22);var l=Math.max(-1,Math.min(1,shade*.3));var o=i*4;
data[o]=Math.max(0,Math.min(255,tint[0]+l*140));data[o+1]=Math.max(0,Math.min(255,tint[1]+l*140));data[o+2]=Math.max(0,Math.min(255,tint[2]+l*150));data[o+3]=amp*235;}}
ctx.putImageData(image,0,0);requestAnimationFrame(step);}
var active=new Map(),SPACING=12;
addEventListener('pointerdown',function(e){active.set(e.pointerId,{x:e.clientX,y:e.clientY});drop(e.clientX,e.clientY,e.pointerType==='touch'?200:260,4);});
addEventListener('pointermove',function(e){var last=active.get(e.pointerId);if(!last)return;var dx=e.clientX-last.x,dy=e.clientY-last.y,dist=Math.hypot(dx,dy);if(dist<SPACING)return;var steps=Math.min(12,Math.floor(dist/SPACING)),p=Math.min(110,40+dist/steps*2);for(var s=1;s<=steps;s++){var t=s/steps;drop(last.x+dx*t,last.y+dy*t,p,3);}active.set(e.pointerId,{x:e.clientX,y:e.clientY});});
function up(e){active.delete(e.pointerId);}
addEventListener('pointerup',up);addEventListener('pointercancel',up);
addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
addEventListener('resize',resize);
setInterval(function(){drop(Math.random()*innerWidth,Math.random()*innerHeight,40,3);},3200);
resize();requestAnimationFrame(step);
})();
</script></body></html>
